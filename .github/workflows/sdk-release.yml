name: Release SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - name: Verify tag matches SDK version
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/sdk/package.json').version")"
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version ($tag_version) does not match packages/sdk version ($package_version)." >&2
            exit 1
          fi

      - run: bun run --cwd packages/sdk test
      - run: bun run --cwd packages/sdk typecheck
      - run: bun run --cwd packages/sdk build

      - name: Publish to npm
        run: npm publish
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
